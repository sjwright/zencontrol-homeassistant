name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out zencontrol-homeassistant
        uses: actions/checkout@v5
        with:
          path: zencontrol-homeassistant

      - name: Check out zencontrol-python
        uses: actions/checkout@v5
        with:
          repository: sjwright/zencontrol-python
          path: zencontrol-python

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            zencontrol-homeassistant/dev/requirements.txt
            zencontrol-python/pyproject.toml

      # pyproject points pyright at ./.venv and extraPaths at ../zencontrol-python.
      - name: Install dependencies
        working-directory: zencontrol-homeassistant
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r dev/requirements.txt
          .venv/bin/python -m pip install -e ../zencontrol-python

      - name: Ruff
        working-directory: zencontrol-homeassistant
        run: .venv/bin/ruff check --output-format=github .

      - name: Pyright
        working-directory: zencontrol-homeassistant
        run: .venv/bin/pyright custom_components/zencontrol_tpi

      - name: Pytest
        working-directory: zencontrol-homeassistant
        run: .venv/bin/pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
