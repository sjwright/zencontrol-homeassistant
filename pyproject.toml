[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".*", "__pycache__", "homeassistant-config"]
markers = [
  "simulator: integration tests that start zencontrol-simulator (installed or sibling ../zencontrol-simulator)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
extraPaths = ["../zencontrol-python", "../zencontrol-simulator"]
# Home Assistant declares Entity.available, native_value and friends as
# cached_property, but overriding them with a plain @property is the documented
# integration pattern. HA core checks itself with mypy, which allows it.
reportIncompatibleVariableOverride = false
# homeassistant.components.* re-export their public names without an explicit
# __all__, so pyright treats documented imports like ColorMode as private.
reportPrivateImportUsage = false
# Exhaustive match + case _: is intentional defensive coding against new enum members.
reportUnreachable = false

[tool.ruff]
target-version = "py314"
line-length = 130

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "N",
  "RUF",
  "SLF",
  "UP"
]
ignore = [
  # Typographic dashes and symbols in prose and UI labels are deliberate.
  "RUF001",
  "RUF002",
  "RUF003"
]

[tool.ruff.lint.per-file-ignores]
# Tests drive private hub/entity internals directly.
"tests/**" = ["SLF001"]
